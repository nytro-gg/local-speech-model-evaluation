<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Faster-Whisper Small vs Medium benchmark</title>
<desc id="desc">Side-by-side horizontal bar charts. Small transcribed in 145.80 seconds and used 1,064.01 megabytes peak sampled process RSS. Medium transcribed in 302.09 seconds and used 2,644.46 megabytes. Same 731.74 second recording, CPU INT8, VAD off.</desc>
<defs>
 <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#111d32"/><stop offset="1" stop-color="#0b1424"/></linearGradient>
 <linearGradient id="small" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#25c9b8"/><stop offset="1" stop-color="#42a5f5"/></linearGradient>
 <linearGradient id="medium" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8066ed"/><stop offset="1" stop-color="#b18cff"/></linearGradient>
</defs>
<rect width="1200" height="600" rx="24" fill="#070e1b"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
 <text x="50" y="58" font-size="30" font-weight="700" fill="#edf4ff">Matched CPU INT8 benchmark</text>
 <text x="50" y="91" font-size="17" fill="#91a4c2">Same 731.74-second recording · automatic language · beam size 5 · VAD off</text>
 <rect x="40" y="120" width="540" height="390" rx="18" fill="url(#panel)" stroke="#2a3e5d"/>
 <rect x="620" y="120" width="540" height="390" rx="18" fill="url(#panel)" stroke="#2a3e5d"/>
 <text x="72" y="166" font-size="23" font-weight="700" fill="#dceaff">Transcription time</text>
 <text x="72" y="194" font-size="15" fill="#8298b8">Seconds · lower is faster</text>
 <text x="652" y="166" font-size="23" font-weight="700" fill="#dceaff">Peak sampled process RSS</text>
 <text x="652" y="194" font-size="15" fill="#8298b8">MB · sampled every 250 ms</text>
 <!-- Time grid -->
 <g stroke="#293b56" stroke-width="1">
  <path d="M170 222 V435 M260 222 V435 M350 222 V435 M440 222 V435 M530 222 V435"/>
  <path d="M750 222 V435 M840 222 V435 M930 222 V435 M1020 222 V435 M1110 222 V435"/>
 </g>
 <g fill="#a7b8d2" font-size="14">
  <text x="170" y="460" text-anchor="middle">0</text><text x="260" y="460" text-anchor="middle">75</text><text x="350" y="460" text-anchor="middle">150</text><text x="440" y="460" text-anchor="middle">225</text><text x="530" y="460" text-anchor="middle">300</text>
  <text x="750" y="460" text-anchor="middle">0</text><text x="840" y="460" text-anchor="middle">750</text><text x="930" y="460" text-anchor="middle">1,500</text><text x="1020" y="460" text-anchor="middle">2,250</text><text x="1110" y="460" text-anchor="middle">3,000</text>
 </g>
 <g fill="#dbe7f8" font-size="16" font-weight="600">
  <text x="76" y="279">Small</text><text x="76" y="365">Medium</text>
  <text x="656" y="279">Small</text><text x="656" y="365">Medium</text>
 </g>
 <rect x="170" y="245" width="174.96" height="48" rx="9" fill="url(#small)"/>
 <rect x="170" y="331" width="362.51" height="48" rx="9" fill="url(#medium)"/>
 <rect x="750" y="245" width="127.68" height="48" rx="9" fill="url(#small)"/>
 <rect x="750" y="331" width="317.33" height="48" rx="9" fill="url(#medium)"/>
 <g fill="#f0f6ff" font-size="17" font-weight="700">
  <text x="355" y="276">145.80 s</text><text x="542" y="362">302.09 s</text>
  <text x="888" y="276">1,064 MB</text><text x="1078" y="362">2,644 MB</text>
 </g>
 <rect x="40" y="530" width="1120" height="42" rx="12" fill="#101d31" stroke="#2a3e5d"/>
 <text x="600" y="557" text-anchor="middle" font-size="16" fill="#b4c5dd">Single run per model · download and model-load time excluded from transcription time and RTF</text>
</g>
</svg>